<html lang="en">
<head>
<script>








(function () {
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia || md.__voiceGuard) return;
  const L = window.VOICE_GUARD_LIMITS || {};  // tests shorten these; pages never set it
  const IDLE = L.idle || 180e3, HIDDEN = L.hidden || 120e3;
  const orig = md.getUserMedia.bind(md);
  const live = new Set();
  let tick = null, bar = null, lastAction = Date.now(), hiddenSince = null;
  md.__voiceGuard = true;

  const PING = L.ping || 30e3;  // the server counts these as activity; only on real input, never on a timer
  let lastPing = 0;
  const touch = () => {
    lastAction = Date.now();
    if (live.size && lastAction - lastPing >= PING) {
      lastPing = lastAction;
      fetch('/voice/activity', {method: 'POST', keepalive: true}).catch(() => {});
    }
  };
  for (const ev of ['pointerdown', 'keydown', 'wheel', 'touchstart', 'scroll'])
    addEventListener(ev, touch, {capture: true, passive: true});

  const mmss = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function show(text, on) {
    if (!bar) {
      bar = document.createElement('div');
      bar.setAttribute('role', 'status');
      bar.dataset.voiceGuard = '1';
      bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:2147483647;padding:14px 16px;font:700 17px/1.3 -apple-system,system-ui,sans-serif;text-align:center;cursor:pointer;color:#fff;';
      bar.onclick = e => { e.stopPropagation(); stopAll('stopped by you'); };
      (document.body || document.documentElement).appendChild(bar);
    }
    bar.textContent = text;
    bar.style.display = text ? 'block' : 'none';
    bar.style.background = on ? '#d00000' : '#333';
    if (!on && text) setTimeout(() => { if (!live.size && bar) bar.style.display = 'none'; }, 6000);
  }
  function stopAll(reason) {
    if (!live.size) return;
    for (const s of live) s.tracks.forEach(t => t.stop());
    live.clear(); clearInterval(tick); tick = null;
    show('Microphone stopped: ' + reason, false);
    dispatchEvent(new CustomEvent('voiceguard:stop', {detail: reason}));
  }
  function check() {
    const now = Date.now();
    for (const s of [...live]) if (s.tracks.every(t => t.readyState === 'ended')) live.delete(s);
    if (!live.size) { clearInterval(tick); tick = null; if (bar) bar.style.display = 'none'; return; }
    if (now - lastAction > IDLE) return stopAll(`${Math.round(IDLE / 60000)} min with no vote, click or scroll`);
    if (hiddenSince !== null && now - hiddenSince > HIDDEN) return stopAll(`tab hidden over ${Math.round(HIDDEN / 60000)} min`);
    const start = Math.min(...[...live].map(s => s.start));
    show(`RECORDING ${mmss(now - start)} · tap to stop · stops after ${mmss(IDLE)} without a vote or scroll (${mmss(IDLE - (now - lastAction))} left)`, true);
  }
  md.getUserMedia = async function (c) {
    const stream = await orig(c);
    if (c && c.audio) {
      live.add({tracks: stream.getAudioTracks(), start: Date.now()});
      lastAction = Date.now();
      if (!tick) tick = setInterval(check, 500);
      check();
    }
    return stream;
  };
  document.addEventListener('visibilitychange', () => { hiddenSince = document.hidden ? Date.now() : null; if (!document.hidden) check(); });
  addEventListener('pagehide', () => stopAll('page closed'));
  window.VOICE_GUARD = {stopAll, live, IDLE, HIDDEN, check};
})();
</script>

:root{

*{box-sizing:border-box}

.nmsg.err{color:#c40000}

.nav{display:flex;gap:8px;margin-top:20px}
.nav button{flex:1;min-height:44px;background:var(--ground);border:1.5px solid var(--ink);font-weight:500}
div.done{padding:80px 20px;text-align:center}
div.done h2{font-size:40px;font-weight:900;margin:0 0 8px}
.err{background:#c40000;color:#fff;padding:8px 16px;font-size:13px}


.lb{position:fixed;inset:0;z-index:50;background:#000;overflow:auto;display:none;cursor:zoom-out;touch-action:pan-x pan-y pinch-zoom;-webkit-overflow-scrolling:touch}

.stack{max-width:980px;margin:0 auto;padding:12px 16px 120px}

.row{display:grid;grid-template-columns:132px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #000}
.thumb{width:132px;height:88px;background:var(--stage);overflow:hidden;position:relative}

.proto{font-size:12px;color:var(--soft);margin:6px 0 0}
.cutnav{display:flex;gap:8px;padding:12px 16px 0;flex-wrap:wrap}.cutnav a{padding:8px 12px;border:1.5px solid #111;text-decoration:none;font-weight:500}.cutnav a.on{background:#111;color:#fff}
.fullcut{padding:16px;max-width:1500px;margin:0 auto}.fullcut h1{font-size:28px;line-height:1.15;margin:6px 0}.fullcut .cutstatus{font-size:14px;color:#555;margin:0 0 12px}.fullcut .cutlayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}.fullcut video{display:block;width:100%;max-height:calc(100svh - 210px);background:#0b0b0b}.fullcut aside{border:1.5px solid #111;padding:14px;align-self:start}.fullcut aside p{margin:0 0 12px;overflow-wrap:anywhere}.fullcut aside a{display:block;padding:10px;border:1.5px solid #111;text-align:center}.fullcut .cutlist{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.fullcut .cutlist a{padding:6px 9px;border:1.5px solid #111;text-decoration:none}.fullcut .cutlist a.on{background:#0047ff;border-color:#0047ff;color:#fff}
.exactact{width:100%;min-height:44px;border:1.5px solid #111;background:#fff;font-weight:500;margin:4px 0 12px}.exacthistory{margin-top:12px;border-top:1.5px solid #111;padding-top:8px}.exacthistory summary{cursor:pointer;font-weight:700}.exacthistory p{margin:8px 0!important}.exactid{overflow-wrap:anywhere}.exactedit .nav{display:none}
@media(max-width:800px){.top .dirs{max-width:50vw;overflow-x:auto;white-space:nowrap}.where .line{display:block}.where .line b,.where .line span{display:block;overflow:hidden;text-overflow:ellipsis}.where .line b{font-size:12px}.where .line span{font-size:11px}.fullcut .cutlayout{display:block}.fullcut video{max-height:48svh}.fullcut aside{margin-top:10px}}


.grid{padding:14px 16px 120px}
.grid h2{font-size:24px;font-weight:900;margin:2px 0 6px;line-height:1.1}
.ghead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:10px 0 12px}
.gcount{font-weight:700}

.tile .tl{font-size:13px;line-height:1.25;padding:0 8px;margin:6px 0;min-height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.tile .tb{display:flex;border-top:1.5px solid var(--ink);margin-top:auto}

}

@media(max-width:800px){
  .reel{--dock-height:340px;padding-bottom:var(--dock-height)}
